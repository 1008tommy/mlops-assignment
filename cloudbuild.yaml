# Cloud Build config: build the Docker image (pulling DVC-tracked data inside
# the build) and deploy the app to Cloud Run.
#
# One-time setup before this works:
#   - Secret Manager secret `gdrive-dvc-credentials` = base64 of a Google
#     service-account key that has access to the DVC gdrive remote folder.
#   - Grant the Cloud Build service account read access to that secret:
#       gcloud secrets add-iam-policy-binding gdrive-dvc-credentials \
#         --member="serviceAccount:$PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#         --role="roles/secretmanager.secretAccessor"
#   - Point your Cloud Build trigger at this file (cloudbuild.yaml).
#
# Adjust REGION and the Artifact Registry repo / Cloud Run service names
# (asia-southeast1, mlops-images, mlops-webapp) to match your project.

steps:
  # Build the image, passing the gdrive credentials as a build arg so the
  # Dockerfile's `dvc pull` step can fetch the raw data CSVs.
  - name: 'gcr.io/cloud-builders/docker'
    secretEnv: ['GDRIVE_CREDENTIALS_DATA']
    entrypoint: 'sh'
    args:
      - '-c'
      - >-
        docker build
        --build-arg=GDRIVE_CREDENTIALS_DATA="$$GDRIVE_CREDENTIALS_DATA"
        -t asia-southeast1-docker.pkg.dev/$PROJECT_ID/mlops-images/mlops-webapp:$COMMIT_SHA
        .

  # Push the image to Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/mlops-images/mlops-webapp:$COMMIT_SHA'

  # Deploy to Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mlops-webapp'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/mlops-images/mlops-webapp:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--allow-unauthenticated'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/gdrive-dvc-credentials/versions/latest
      env: GDRIVE_CREDENTIALS_DATA

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/mlops-images/mlops-webapp:$COMMIT_SHA'
