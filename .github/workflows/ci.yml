name: CI/CD

on:
  push:
    branches: [main, deployment-testing]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run pytest

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Pull DVC-tracked data
        run: |
          pip install "dvc[gdrive]"
          echo '${{ secrets.DVC_GDRIVE_SA_KEY }}' > dvc-ci-key.json
          dvc remote modify --local myremote gdrive_use_service_account true
          dvc remote modify --local myremote gdrive_service_account_json_file_path dvc-ci-key.json
          dvc pull

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set service name for this branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "SERVICE_NAME=mlops-assignment" >> $GITHUB_ENV
          else
            echo "SERVICE_NAME=mlops-assignment-staging" >> $GITHUB_ENV
          fi

      - name: Build and push image
        run: |
          IMAGE=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/webapp:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image=${{ env.IMAGE }} \
            --region=europe-west1 \
            --allow-unauthenticated \
            --project=${{ secrets.GCP_PROJECT_ID }}