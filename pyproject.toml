[project]
name = "mlops-assignment"
version = "0.1.0"
description = ""
authors = [
    { name = "Darren Chor", email = "darrenchor1832@gmail.com" },
    { name = "Javian Ng", email = "javianng19@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas (>=2.0,<2.2)",
    "matplotlib (>=3.7,<3.8)",
    "numpy (>=1.24,<1.27)",
    "scikit-learn (>=1.3,<1.5)",
    "seaborn (>=0.13.2,<0.14.0)",
    "hydra-core (>=1.3.5,<2.0.0)",
    "dvc[gdrive] (>=3.67.1,<4.0.0)",
    "joblib (>=1.2,<1.4)",
    "streamlit (>=1.35,<2.0.0)",
    "pyopenssl (>=25.3,<26)",
    "setuptools (==80.9.0)",
    "pycaret (==3.3.2)",
    "mlflow (==2.17.2)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "jupyterlab"
]
